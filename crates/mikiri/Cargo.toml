[package]
name = "mikiri"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
guard = { path = "../guard" }
jiff = "=1.0.1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
zip = { version = "=9.7.0", default-features = false, features = ["deflate-flate2"] }
arrow-array = { version = "60.1.0", default-features = false }
arrow-schema = { version = "60.1.0", default-features = false }
libm = "0.2.16"
parquet = { version = "60.1.0", default-features = false, features = ["arrow", "zstd"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
time = { version = "0.3", features = ["parsing"] }

[dev-dependencies]
proptest = "1.12.0"
