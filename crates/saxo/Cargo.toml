[package]
name = "saxo"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
nautilus-live = { version = "=0.68.0", default-features = false }
nautilus-core = { version = "=0.68.0", default-features = false }
anyhow = "1"
log = "0.4"
async-trait = "0.1"
nautilus-common = { version = "=0.68.0", default-features = false }
nautilus-model = { version = "=0.68.0", default-features = false }
nautilus-network = { version = "=0.68.0", default-features = false }
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync", "io-util"] }
sha2 = "0.11"
base64 = "0.23"
rand = "0.10"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["parsing", "formatting"] }


[dev-dependencies]
nautilus-live = { version = "=0.68.0", default-features = false, features = ["node"] }
nautilus-trading = { version = "=0.68.0", default-features = false }
tempfile = "3"
proptest = "1.12.0"
