[package]
name = "paper-order"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
guard = { path = "../guard" }
nautilus-core = { version = "=0.68.0", default-features = false }
nautilus-common = { version = "=0.68.0", default-features = false, features = ["live"] }
nautilus-live = { version = "=0.68.0", default-features = false, features = ["node"] }
nautilus-interactive-brokers = { version = "=0.68.0", default-features = false }
nautilus-model = { version = "=0.68.0", default-features = false }
nautilus-trading = { version = "=0.68.0", default-features = false }
ibapi = { version = "=5.0.0", default-features = false, features = ["async"] }
anyhow = "1"
futures = "0.3"
jiff = "0.2"
time = "0.3"
tokio = { version = "1", features = ["rt", "time", "macros"] }

[dev-dependencies]
proptest = "1.12.0"
